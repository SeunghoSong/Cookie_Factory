<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>주머니 속의 스마트 팩토리 - 대시보드</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0a0a0a; color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  h1 { font-size: 18px; opacity: 0.8; margin: 0; }
  .top-bar { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 720px; justify-content: space-between; }
  .cam-badge {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cam-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .cam-badge.on { background: rgba(74,222,128,0.15); color: #4ade80; }
  .cam-badge.on .dot { background: #4ade80; }
  .cam-badge.off { background: rgba(248,113,113,0.15); color: #f87171; }
  .cam-badge.off .dot { background: #f87171; }
  .ws-badge { font-size: 11px; opacity: 0.6; }

  .main-view {
    position: relative; width: 100%; max-width: 720px; aspect-ratio: 4 / 3;
    background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333;
    display: flex; align-items: center; justify-content: center;
  }
  .main-view img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .main-view .placeholder { color: #555; font-size: 14px; }
  .result-banner {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 14px;
    background: rgba(0,0,0,0.65); font-size: 15px; font-weight: 700; display: none;
  }
  .result-banner.pass { color: #4ade80; }
  .result-banner.fail { color: #f87171; }
  .result-banner.noobj { color: #fbbf24; }

  .history { width: 100%; max-width: 720px; }
  .history h2 { font-size: 13px; opacity: 0.6; margin: 0 0 8px; font-weight: 600; }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .history-item {
    display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
    background: #151515; border-radius: 6px; padding: 6px 10px; border-left: 3px solid #333;
  }
  .history-item.fail { border-left-color: #f87171; }
  .history-item.pass { border-left-color: #4ade80; }
  .history-item.noobj { border-left-color: #fbbf24; }
  .history-item .fid { opacity: 0.5; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>🖥️ 판정 결과 대시보드</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="ws-badge" id="wsBadge">연결 중...</span>
      <span class="cam-badge off" id="camBadge"><span class="dot"></span>NO CAMERA</span>
    </div>
  </div>

  <div class="main-view">
    <img id="resultImg" alt="마킹된 프레임" />
    <span class="placeholder" id="placeholder">아직 수신된 판정 결과가 없습니다.</span>
    <div class="result-banner" id="resultBanner"></div>
  </div>

  <div class="history">
    <h2>최근 판정 이력 (C4 출력 확인용)</h2>
    <div class="history-list" id="historyList"></div>
  </div>

<script>
const camBadge = document.getElementById('camBadge');
const wsBadge = document.getElementById('wsBadge');
const resultImg = document.getElementById('resultImg');
const placeholder = document.getElementById('placeholder');
const resultBanner = document.getElementById('resultBanner');
const historyList = document.getElementById('historyList');

const MAX_HISTORY = 10;
const history = [];
let ws = null;

function setCameraBadge(connected) {
  camBadge.className = 'cam-badge ' + (connected ? 'on' : 'off');
  camBadge.innerHTML = `<span class="dot"></span>${connected ? 'CAMERA LIVE' : 'NO CAMERA'}`;
}

function statusClass(status) {
  if (status === 'FAIL') return 'fail';
  if (status === 'NO_OBJECT') return 'noobj';
  return 'pass';
}

function statusLabel(status, circularity) {
  if (status === 'NO_OBJECT') return '검출 대상 없음';
  if (status === 'FAIL') return `불량 (FAIL) · 원형도 ${Number(circularity).toFixed(2)}`;
  return `정상 (PASS) · 원형도 ${Number(circularity).toFixed(2)}`;
}

function renderResult(msg) {
  placeholder.style.display = 'none';
  resultImg.style.display = 'block';
  resultImg.src = `data:image/jpeg;base64,${msg.image}`;

  const cls = statusClass(msg.status);
  resultBanner.className = 'result-banner ' + cls;
  resultBanner.style.display = 'block';
  resultBanner.textContent = statusLabel(msg.status, msg.circularity);

  history.unshift(msg);
  if (history.length > MAX_HISTORY) history.pop();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = history.map((msg) => {
    const cls = statusClass(msg.status);
    const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString();
    return `<div class="history-item ${cls}">
      <span>${statusLabel(msg.status, msg.circularity)}</span>
      <span class="fid">${time} · ${msg.frame_id ?? ''}</span>
    </div>`;
  }).join('');
}

function connectWebSocket() {
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocol}://${location.host}/ws/dashboard`);

  ws.onopen = () => { wsBadge.textContent = '서버 연결됨'; };
  ws.onclose = () => {
    wsBadge.textContent = '연결 끊김, 재연결 중...';
    setTimeout(connectWebSocket, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'camera_status') {
      setCameraBadge(!!msg.connected);
    } else if (msg.type === 'result') {
      renderResult(msg);
    }
  };
}

connectWebSocket();
</script>
</body>
</html>
